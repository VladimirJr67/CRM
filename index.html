<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алвид CRM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="https://avatars.mds.yandex.net/i?id=59709a441721a5e380612fdd93e30472_l-5098586-images-thumbs&n=13" alt="Алвид">
    <h2>Алвид CRM</h2>
    <input type="text" id="loginInput" placeholder="Логин" value="Admin">
    <input type="password" id="passwordInput" placeholder="Пароль" value="Admin">
    <button onclick="doLogin()">Войти</button>
    <div class="login-error" id="loginError">Неверный логин или пароль</div>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="https://avatars.mds.yandex.net/i?id=59709a441721a5e380612fdd93e30472_l-5098586-images-thumbs&n=13" alt="Алвид">
      <span>Алвид</span>
    </div>
    <div class="menu">
      <div class="menu-item" data-section="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Заказы
      </div>
      <div class="menu-item active" data-section="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Клиенты
      </div>
      <div class="menu-item" data-section="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Задачи
      </div>
      <div class="menu-item" data-section="reminders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        Напоминания
      </div>
      <div class="menu-item" data-section="contacts" onclick="toggleContactsSubmenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/><path d="M2 21v-2a4 4 0 013-3.87M8 3.13a4 4 0 010 7.75"/></svg>
        Контакты
        <svg id="contactsArrow" style="margin-left:auto;width:16px;height:16px;transform:rotate(0deg);transition:transform 0.2s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="submenu" id="contactsSubmenu">
        <div class="submenu-item active" data-subsection="internal" onclick="showContactsSubsection('internal')">📞 Внутренние</div>
        <div class="submenu-item" data-subsection="mobile" onclick="showContactsSubsection('mobile')">📱 Мобильные</div>
      </div>
    </div>
    <div class="user-info">
      <div class="user-avatar">A</div>
      <span>Admin</span>
      <button class="logout-btn" onclick="doLogout()">Выйти</button>
    </div>
  </div>

  <div class="main" id="mainContent">
    <!-- Контент загружается через JS -->
  </div>
</div>

<!-- Подключаем JS модули -->
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/clients.js"></script>
<script src="js/contacts.js"></script>
<script src="js/reminders.js"></script>
<script src="js/tasks.js"></script>
<script src="js/app.js"></script>

</body>
</html>
